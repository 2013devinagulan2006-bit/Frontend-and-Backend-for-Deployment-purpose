<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Mart - Products</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
    }

    nav {
        background: linear-gradient(135deg, #ff4f9a, #ff1493);
        padding: 18px 40px;
        display: flex;
        align-items: center;
        gap: 25px;
        flex-wrap: wrap;
    }

    .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .search {
        flex: 1;
        max-width: 500px;
    }

    .search input {
        width: 100%;
        padding: 13px 18px;
        border: none;
        border-radius: 25px;
        outline: none;
        font-size: 15px;
    }

    .nav-links {
        display: flex;
        gap: 20px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .container {
        width: 92%;
        max-width: 1300px;
        margin: 35px auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .sync-container {
        text-align: center;
        margin-bottom: 30px;
    }

    .sync-btn {
        background: #4caf50;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
    }

    .sync-btn:hover {
        background: #388e3c;
    }

    .category-title {
        color: #ff1493;
        margin: 35px 0 20px;
        padding-left: 12px;
        border-left: 5px solid #ff1493;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
    }

    .product-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        transition: 0.3s;
        cursor: pointer;
    }

    .product-card:hover {
        transform: translateY(-5px);
    }

    .product-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        padding: 15px;
        background: white;
    }

    .product-info {
        padding: 18px;
    }

    .product-name {
        font-size: 18px;
        font-weight: bold;
        min-height: 45px;
    }

    .price {
        color: #e91e63;
        font-size: 20px;
        font-weight: bold;
        margin: 12px 0;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .buttons button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    .cart-btn {
        background: #ff1493;
        color: white;
    }

    .wishlist-btn {
        background: #fff0f6;
        color: #e91e63;
        border: 1px solid #e91e63 !important;
    }

    .buy-btn {
        background: #ff9800;
        color: white;
    }

    .cart-btn:hover {
        background: #d90072;
    }

    .wishlist-btn:hover {
        background: #ffd9e9;
    }

    .buy-btn:hover {
        background: #e68900;
    }

    .no-result {
        text-align: center;
        font-size: 20px;
        color: #777;
        padding: 50px 20px;
    }

    footer {
        margin-top: 50px;
        padding: 25px;
        background: #222;
        color: white;
        text-align: center;
    }
</style>

</head>

<body>

<nav>

    <div class="logo">
        Devi Mart
    </div>

    <div class="search">

        <input
            type="text"
            id="searchBox"
            placeholder="Search products..."
        >

    </div>

    <div class="nav-links">

        <a href="home.html">
            Home
        </a>

        <a href="wishlist.html">
            ♡ Wishlist
        </a>

        <a href="cart.html">
            Cart 🛒 (<span id="cartCount">0</span>)
        </a>

    </div>

</nav>


<div class="container">

    <h1 id="pageTitle">
        All Products
    </h1>

    <div class="sync-container">

        <button
            class="sync-btn"
            onclick="syncProductsToBackend()"
        >
            Save Products to Database
        </button>

    </div>

        🍫 Chocolates
    </h2>

    <div class="products" id="electronics"></div>


    <h2 class="category-title" id="flowersTitle">
        🌸 Flowers

    <div class="products" id="flowers"></div>


    <div class="no-result" id="noResult" style="display:none;">
        No products found.
    </div>

</div>


<footer>

    <p>
        © 2026 Devi Mart. All Rights Reserved.
    </p>

</footer>

    }

];


let products = JSON.parse(localStorage.getItem("products"));

if (!products || products.length === 0) {

    products = defaultProducts;

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


/* Get search and category from URL */

const urlParams = new URLSearchParams(
    window.location.search
);

const searchText =
    (urlParams.get("search") || "")
    .trim()
    .toLowerCase();

const selectedCategory =
    (urlParams.get("category") || "")
    .trim()
    .toLowerCase();


/* Put search text inside Products page search box */

document.getElementById("searchBox").value =
    urlParams.get("search") || "";


/* Display products */

function displayProducts() {

    document.getElementById("chocolates").innerHTML = "";
    document.getElementById("electronics").innerHTML = "";
    document.getElementById("flowers").innerHTML = "";

    let filteredProducts = products;


    /* Search filter */

    if (searchText !== "") {

        filteredProducts = filteredProducts.filter(function(product) {

            return product.name
                .toLowerCase()
                .includes(searchText);

        });

    }


    /* Category filter */

    if (selectedCategory !== "") {

        filteredProducts = filteredProducts.filter(function(product) {

            return product.category.toLowerCase() === selectedCategory;

        });

    }


    /* No result */

    if (filteredProducts.length === 0) {

        document.getElementById("noResult").style.display = "block";

    } else {

        document.getElementById("noResult").style.display = "none";

    }


    /* Change page title */

    if (searchText !== "") {

        document.getElementById("pageTitle").textContent =
            "Search Results for: " + urlParams.get("search");

    } else if (selectedCategory !== "") {

        document.getElementById("pageTitle").textContent =
            selectedCategory.charAt(0).toUpperCase() +
            selectedCategory.slice(1) +
            " Products";

    } else {

        document.getElementById("pageTitle").textContent =
            "All Products";

    }


    /* Hide category headings when searching */

    if (searchText !== "") {

        document.getElementById("chocolateTitle").style.display = "none";
        document.getElementById("electronicsTitle").style.display = "none";
        document.getElementById("flowersTitle").style.display = "none";

    }


    filteredProducts.forEach(function(product) {

        const card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

                <div class="buttons">

                    <button class="cart-btn">
                        🛒 Add to Cart
                    </button>

                    <button class="wishlist-btn">
                        ♡ Add to Wishlist
                    </button>

                    <button class="buy-btn">
                        Buy Now
                    </button>

                </div>

            </div>
        `;


        /* Product card click */

        card.addEventListener("click", function() {

            localStorage.setItem(
                "selectedProduct",
                JSON.stringify(product)
            );

            window.location.href =
                "product-details.html";

        });


        /* ============================
           ADD TO CART - BACKEND
           ============================ */

        const cartButton =
            card.querySelector(".cart-btn");

        cartButton.dataset.productName =
            product.name;


        cartButton.addEventListener(
            "click",
            async function(event) {

                event.stopPropagation();

                cartButton.disabled = true;

                cartButton.textContent =
                    "Adding...";


                const cartItem = {

                    productName: product.name,

                    price: Number(product.price),

                    quantity: 1,

                    totalPrice: Number(product.price),

                    image: product.image

                };


                try {

                    const response = await fetch(
                        "http://localhost:8080/api/cart",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(cartItem)

                        }
                    );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to add product to cart"
                        );

                    }


                    const savedCart =
                        await response.json();


                    alert(
                        savedCart.productName +
                        " added to cart!"
                    );


                    await loadCartStatus();


                } catch (error) {

                    console.error(
                        "Cart Error:",
                        error
                    );


                    cartButton.textContent =
                        "🛒 Add to Cart";


                    alert(
                        "Could not add product to cart. Make sure backend is running."
                    );

                }


                cartButton.disabled = false;

            }
        );


        /* ============================
           ADD TO WISHLIST
           ============================ */

        card.querySelector(".wishlist-btn")
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                let wishlist =
                    JSON.parse(
                        localStorage.getItem("wishlist")
                    ) || [];


                let alreadyExists =
                    wishlist.some(function(item) {

                        return item.name === product.name;

                    });


                if (alreadyExists) {

                    alert(
                        product.name +
                        " is already in your wishlist!"
                    );

                    return;

                }


                wishlist.push({

                    name: product.name,

                    price: Number(product.price),

                    image: product.image

                });


                localStorage.setItem(
                    "wishlist",
                    JSON.stringify(wishlist)
                );


                alert(
                    product.name +
                    " added to wishlist!"
                );

            }
        );


        /* ============================
           BUY NOW
           ============================ */

        card.querySelector(".buy-btn")
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                localStorage.setItem(
                    "selectedProduct",
                    JSON.stringify(product)
                );


                window.location.href =
                    "product-details.html";

            }
        );


        const categoryContainer =
            document.getElementById(
                product.category
            );


        if (categoryContainer) {

            categoryContainer.appendChild(card);

        }

    });

}

/* ============================
   LOAD CART FROM BACKEND
   ============================ */

async function loadCartStatus() {

    try {

        const response =
            await fetch(
                "http://localhost:8080/api/cart"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load cart"
            );

        }


        const cart =
            await response.json();


        /* Calculate total quantity */

        let totalQuantity = 0;


        cart.forEach(function(item) {

            totalQuantity +=
                Number(item.quantity);

        });


        /* Update cart count */

        document.getElementById(
            "cartCount"
        ).textContent =
            totalQuantity;


        /* Update every product button */

        document.querySelectorAll(".cart-btn")
        .forEach(function(button) {

            const productName =
                button.dataset.productName;


            const cartItem =
                cart.find(function(item) {

                    return item.productName ===
                        productName;

                });


            if (cartItem) {

                button.textContent =
                    "🛒 Added (" +
                    cartItem.quantity +
                    ")";

            } else {

                button.textContent =
                    "🛒 Add to Cart";

            }

        });


    } catch (error) {

        console.error(
            "Could not load cart:",
            error
        );

    }

}


/* Load cart status when page opens */

loadCartStatus();


/* ============================
   SYNC PRODUCTS WITH BACKEND
   ============================ */

async function syncProductsToBackend() {

    try {

        const existingResponse =
            await fetch(
                "http://localhost:8080/api/products"
            );


        if (!existingResponse.ok) {

            throw new Error(
                "Could not get products from backend"
            );

        }


        const existingProducts =
            await existingResponse.json();


        const existingNames =
            existingProducts.map(
                function(product) {

                    return product.name;

                }
            );


        const newProducts =
            products.filter(
                function(product) {

                    return !existingNames.includes(
                        product.name
                    );

                }
            );


        if (newProducts.length === 0) {

            alert(
                "All products are already in H2 database!"
            );

            return;

        }


        const productsForBackend =
            newProducts.map(
                function(product) {

                    return {

                        name: product.name,

                        price: Number(product.price),

                        stock: 10,

                        imageUrl: product.image,

                        description: "",

                        category: product.category

                    };

                }
            );


        const response =
            await fetch(
                "http://localhost:8080/api/products/bulk",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(
                        productsForBackend
                    )

                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to save products"
            );

        }


        alert(
            newProducts.length +
            " products saved to H2 database!"
        );


    } catch (error) {

        console.error(error);


        alert(
            "Could not connect to backend. Make sure Spring Boot is running."
        );

    }

}


/* ============================
   PRODUCTS PAGE SEARCH
   ============================ */

document.getElementById("searchBox")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            const value =
                this.value.trim();


            if (value === "") {

                window.location.href =
                    "products.html";

            } else {

                window.location.href =
                    "products.html?search=" +
                    encodeURIComponent(value);

            }

        }

    }
);
