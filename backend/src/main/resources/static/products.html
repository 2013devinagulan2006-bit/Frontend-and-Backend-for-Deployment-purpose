    .cart-btn:hover {

    }

    .wishlist-btn {

        background: #ff4f81;
        color: white;
    }

    .buy-btn {
        background: #333;
        color: white;

    .buy-btn:hover {
        background: #555;
    }

    #noProducts {
        text-align: center;
        padding: 50px;
        color: #777;
        display: none;
        grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
        header {
            padding: 15px 20px;

            gap: 10px;
        }

        nav a {
            margin: 0 7px;
        }

        #productsContainer {
            width: 94%;
        }

</style>

let products = defaultProducts;

localStorage.setItem(
    "products",
    JSON.stringify(products)
);

const params = new URLSearchParams(window.location.search);

const categoryFromURL = params.get("category");
const searchFromURL = params.get("search");

function displayProducts(list) {

    const container =
        document.getElementById("productsContainer");

    container.innerHTML = "";

    if (list.length === 0) {

        container.innerHTML = `
            <div id="noProducts">
                <h3>No products found</h3>
                <p>Please try another category.</p>
            </div>
        `;

        return;
    }

    list.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                onclick="openProduct(${product.id})"
                onerror="this.src='https://via.placeholder.com/500x400?text=Devi+Mart'"
            >

            <div class="product-info">

                <h3>${product.name}</h3>

                <div class="category-name">
                    ${formatCategory(product.category)}
                </div>

                <div class="price">
                    ₹${Number(product.price).toFixed(2)}
                </div>

                <div class="button-row">

                    <button
                        class="product-btn cart-btn"
                        onclick="addToCart(${product.id})"
                    >
                        🛒 Add to Cart
                    </button>

                    <button
                        class="product-btn wishlist-btn"
                        onclick="addToWishlist(${product.id})"
                    >
                        ❤️ Add to Wishlist
                    </button>

                    <button
                        class="product-btn buy-btn"
                        onclick="buyNow(${product.id})"
                    >
                        ⚡ Buy Now
                    </button>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}

function formatCategory(category) {

    if (!category) {
        return "";
    }

    return category.charAt(0).toUpperCase()
        + category.slice(1);
}

function openProduct(id) {

    const product =
        products.find(
            p => Number(p.id) === Number(id)
        );

    if (!product) {

        alert("Product not found");

        return;
    }

    localStorage.setItem(
        "selectedProduct",
        JSON.stringify(product)
    );

    window.location.href =
        "product-details.html";
}

async function addToCart(id) {

    const product =
        products.find(
            p => Number(p.id) === Number(id)
        );

    if (!product) {

        alert("Product not found");

        return;
    }

    const cartItem = {

        productName: product.name,

        price: Number(product.price),

        quantity: 1,

        totalPrice: Number(product.price),

        image: product.image

    };

    try {

        const response =
            await fetch(
                "http://localhost:8080/api/cart",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(cartItem)
                }
            );

        if (!response.ok) {

            throw new Error(
                "Cart API failed"
            );
        }

        alert(
            product.name +
            " added to cart!"
        );

    } catch (error) {

        console.error(error);

        alert(
            "Unable to add product to cart."
        );
    }

}

function addToWishlist(id) {

    const product =
        products.find(
            p => Number(p.id) === Number(id)
        );

    if (!product) {

        alert("Product not found");

        return;
    }

    let wishlist =
        JSON.parse(
            localStorage.getItem("wishlist")
        ) || [];

    const alreadyExists =
        wishlist.some(
            item =>
                Number(item.id) ===
                Number(product.id)
        );

    if (!alreadyExists) {

        wishlist.push(product);

        localStorage.setItem(
            "wishlist",
            JSON.stringify(wishlist)
        );

        alert(
            product.name +
            " added to wishlist!"
        );

    } else {

        alert(
            product.name +
            " is already in wishlist."
        );
    }

}

function buyNow(id) {

    const product =
        products.find(
            p => Number(p.id) === Number(id)
        );

    if (!product) {

        alert("Product not found");

        return;
    }

    const buyNowProduct = {

        productName: product.name,

        price: Number(product.price),

        quantity: 1,

        totalPrice: Number(product.price),

        image: product.image

    };

    localStorage.setItem(
        "buyNowProduct",
        JSON.stringify(buyNowProduct)
    );

    localStorage.setItem(
        "checkoutMode",
        "buyNow"
    );

    localStorage.removeItem(
        "selectedCartIds"
    );

    window.location.href =
        "checkout.html";
}

function showCategory(category) {

    document
        .querySelectorAll(".filter-section button")
        .forEach(button => {

            button.classList.remove("active");

        });

    const selectedButton =
        document.getElementById(
            category + "Btn"
        );

    if (selectedButton) {

        selectedButton.classList.add("active");

    }

    if (category === "all") {

        document.getElementById(
            "pageHeading"
        ).textContent = "All Products";

        displayProducts(products);

        return;
    }

    const filtered =
        products.filter(product =>

            String(product.category)
                .toLowerCase() ===
            category.toLowerCase()

        );

    document.getElementById(
        "pageHeading"
    ).textContent =
        formatCategory(category);

    displayProducts(filtered);
}

function searchProducts(searchText) {

    const text =
        searchText.toLowerCase().trim();

    const filtered =
        products.filter(product =>

            product.name
                .toLowerCase()
                .includes(text)

            ||

            product.category
                .toLowerCase()
                .includes(text)

        );

    document.getElementById(
        "pageHeading"
    ).textContent =
        "Search Results";

    displayProducts(filtered);
}

if (categoryFromURL) {

    const category =
        categoryFromURL.toLowerCase();

    if (
        category === "chocolates" ||
        category === "electronics" ||
        category === "flowers"
    ) {

        showCategory(category);

    } else {

        showCategory("all");

    }

}
else if (searchFromURL) {

    searchProducts(searchFromURL);

}
else {

    showCategory("all");

}
