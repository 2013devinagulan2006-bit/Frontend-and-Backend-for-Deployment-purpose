<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Devi Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f8;
            color: #333;
        }

        nav {
            background: #ff4f87;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        nav h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        .product-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            display: flex;
            gap: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 45%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .product-image img {
            width: 100%;
            max-width: 400px;
            height: 400px;
            object-fit: contain;
            border-radius: 10px;
        }

        .product-info {
            flex: 1;
            padding-top: 20px;
        }

        .product-info h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #333;
        }

        .price {
            font-size: 28px;
            color: #ff4f87;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .quantity {
            margin-bottom: 25px;
        }

        .quantity label {
            font-weight: bold;
            margin-right: 10px;
        }

        .quantity input {
            width: 60px;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cart-btn {
            background: #ff4f87;
            color: white;
        }

        .buy-btn {
            background: #333;
            color: white;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #ff4f87;
            font-weight: bold;
        }

        .image-error {
            width: 100%;
            max-width: 400px;
            height: 400px;
            border-radius: 10px;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #777;
        }

        @media (max-width: 700px) {

            .product-box {
                flex-direction: column;
            }

            .product-image {
                width: 100%;
            }

            .product-image img {
                height: 300px;
            }

            .image-error {
                height: 300px;
            }

            nav {
                padding: 15px;
            }

            nav a {
                margin-left: 10px;
            }
        }
    </style>
</head>

<body>

<nav>

    <h1>Devi Mart</h1>

    <div>
        <a href="home.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </div>

</nav>


<div class="container">

    <div class="product-box">

        <div class="product-image">

            <img
                id="productImage"
                src=""
                alt="Product"
            >

        </div>


        <div class="product-info">

            <h2 id="productName">
                Product Name
            </h2>

            <div
                class="price"
                id="productPrice"
            >
                ₹0
            </div>

            <p
                class="description"
                id="productDescription"
            >
                This product is available at Devi Mart.
                It is a quality product available for online shopping.
            </p>


            <div class="quantity">

                <label for="quantity">
                    Quantity:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                >

            </div>


            <button
                class="cart-btn"
                onclick="addToCart()"
                id="addCartButton"
            >
                Add to Cart
            </button>


            <button
                class="buy-btn"
                onclick="buyNow()"
                id="buyNowButton"
            >
                Buy Now
            </button>


            <br>


            <a
                href="products.html"
                class="back-btn"
            >
                ← Back to Products
            </a>

        </div>

    </div>

</div>


<script>

/* =========================================
   GET SELECTED PRODUCT
   ========================================= */

const selectedProduct =
    JSON.parse(
        localStorage.getItem("selectedProduct")
    );


/* =========================================
   IMAGE FALLBACK
   ========================================= */

function getProductImage(product) {

    if (!product) {
        return "";
    }

    /*
       First use the image already stored
       in the product data.
    */

    if (
        product.image &&
        String(product.image).trim() !== ""
    ) {

        return product.image;

    }


    /*
       Special fallback for Cadbury products.
       This prevents the product-details page
       from showing an empty image.
    */

    const productName =
        String(product.name || "").toLowerCase();


    if (
        productName.includes("dairy milk") ||
        productName.includes("silk") ||
        productName.includes("cadbury")
    ) {

        return "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Cadbury_Dairy_Milk_chocolate_bar.jpg/640px-Cadbury_Dairy_Milk_chocolate_bar.jpg";

    }


    /*
       If no image exists for another product,
       return empty so the error handler can show
       a proper placeholder.
    */

    return "";

}


/* =========================================
   DISPLAY PRODUCT
   ========================================= */

if (selectedProduct) {

    const productImage =
        document.getElementById("productImage");


    const imageSource =
        getProductImage(selectedProduct);


    if (imageSource) {

        productImage.src =
            imageSource;

        productImage.alt =
            selectedProduct.name;

    } else {

        productImage.style.display =
            "none";

        const imageContainer =
            document.querySelector(".product-image");

        imageContainer.innerHTML =
            `
            <div class="image-error">
                📦<br>
                Product Image Not Available
            </div>
            `;

    }


    document.getElementById("productName").textContent =
        selectedProduct.name || "Product Name";


    document.getElementById("productPrice").textContent =
        "₹" +
        Number(selectedProduct.price || 0)
            .toLocaleString("en-IN");


    document.getElementById("productDescription").textContent =
        (selectedProduct.name || "This product") +
        " is a quality product available at Devi Mart. " +
        "Enjoy shopping with Devi Mart.";

} else {

    document.getElementById("productName").textContent =
        "Product Not Found";


    document.getElementById("productDescription").textContent =
        "Please go back to the Products page and select a product.";

}


/* =========================================
   ADD TO CART
   ========================================= */

async function addToCart() {

    if (!selectedProduct) {

        alert("Product not found!");

        return;
    }


    const quantity =
        parseInt(
            document.getElementById("quantity").value
        );


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        alert(
            "Quantity must be at least 1"
        );

        return;
    }


    const cartButton =
        document.getElementById("addCartButton");


    cartButton.disabled = true;

    cartButton.textContent =
        "Adding...";


    const cartItem = {

        productName:
            selectedProduct.name,

        price:
            Number(selectedProduct.price),

        quantity:
            quantity,

        totalPrice:
            Number(selectedProduct.price) *
            quantity,

        image:
            getProductImage(selectedProduct)

    };


    try {

        const response =
            await fetch(
                "http://localhost:8080/api/cart",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(cartItem)
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to add product to cart"
            );

        }


        const savedCart =
            await response.json();


        alert(
            savedCart.productName +
            " added to cart!"
        );


        cartButton.textContent =
            "🛒 Added (" +
            savedCart.quantity +
            ")";


    } catch (error) {

        console.error(
            "Cart Error:",
            error
        );


        cartButton.textContent =
            "Add to Cart";


        alert(
            "Could not add product to cart. " +
            "Make sure Spring Boot backend is running."
        );

    }


    cartButton.disabled = false;

}


/* =========================================
   BUY NOW
   =========================================

   IMPORTANT:

   Buy Now DOES NOT add the product to
   /api/cart.

   Instead, it stores ONLY this product
   temporarily and sends it directly to
   checkout.html.

   Existing cart products remain untouched.
   ========================================= */

function buyNow() {

    if (!selectedProduct) {

        alert("Product not found!");

        return;
    }


    const quantity =
        parseInt(
            document.getElementById("quantity").value
        );


    if (
        isNaN(quantity) ||
        quantity < 1
    ) {

        alert(
            "Quantity must be at least 1"
        );

        return;
    }


    const buyNowProduct = {

        productName:
            selectedProduct.name,

        price:
            Number(selectedProduct.price),

        quantity:
            quantity,

        totalPrice:
            Number(selectedProduct.price) *
            quantity,

        image:
            getProductImage(selectedProduct)

    };


    /*
       Save ONLY the product being bought.
    */

    localStorage.setItem(
        "buyNowProduct",
        JSON.stringify(buyNowProduct)
    );


    /*
       Tell checkout page that this is
       a direct Buy Now checkout.
    */

    localStorage.setItem(
        "checkoutMode",
        "buyNow"
    );


    /*
       Remove old cart-selection information
       so old selected products cannot
       accidentally enter this checkout.
    */

    localStorage.removeItem(
        "selectedCartIds"
    );


    /*
       Go directly to Checkout.
    */

    window.location.href =
        "checkout.html";

}

</script>

</body>
</html>
